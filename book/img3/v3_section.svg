<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820.0 300.0" width="820" height="300"><rect width="100%" height="100%" fill="#f4f6f8"/><text x="20" y="34" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1d2329">Lock: full-height V-tooth, works on both faces</text><rect x="30.0" y="120.0" width="150.0" height="80.0" fill="#cfd5dc" stroke="#5b6573" stroke-width="1.3"/><rect x="180.0" y="120.0" width="2.0" height="80.0" fill="#ffffff" stroke="#ffffff" stroke-width="1.3"/><rect x="182.0" y="120.0" width="160.0" height="80.0" fill="#e7ebef" stroke="#5b6573" stroke-width="1.3"/><polygon points="108.0,120.0 182,120.0 182,200 108.0,200" fill="#f2c45a" stroke="#7a5a00" stroke-width="1.3"/><line x1="20" y1="200" x2="360" y2="200" stroke="#1d2329" stroke-width="3"/><text x="40" y="110.0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#1d2329">hub</text><text x="240" y="110.0" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#1d2329">piece</text><text x="70" y="226" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="600" fill="#1d2329">tooth = whole 2 mm height</text><text x="20" y="248" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="500" fill="#1d2329">canvas</text><text x="440" y="34" font-family="ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="700" fill="#1d2329">Dots: a line with pockets</text><rect x="440.0" y="120.0" width="340.0" height="80.0" fill="#e7ebef" stroke="#5b6573" stroke-width="1.3"/><rect x="480.0" y="120.0" width="44.0" height="80.0" fill="#ffffff" stroke="#5b6573" stroke-width="1.3"/><rect x="590.0" y="120.0" width="44.0" height="80.0" fill="#ffffff" stroke="#5b6573" stroke-width="1.3"/><rect x="700.0" y="120.0" width="44.0" height="80.0" fill="#ffffff" stroke="#5b6573" stroke-width="1.3"/><rect x="440.0" y="120.0" width="340.0" height="24.0" fill="#aeb8c4" strok